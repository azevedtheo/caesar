[project]
name = "caesar-cipher"
version = "0.1.0"
description = "A Caesar cipher cryptanalysis CLI tool"
requires-python = ">=3.10"

dependencies = [
    "typer",
    "rich",
]

[project.scripts]
caesar = "caesar_cipher.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]